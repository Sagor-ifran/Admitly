<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, target-densityDpi=device-dpi" />
    <title>Admitly HTML Template</title>
    <link rel="icon" type="image/png" href="image/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


    <link rel="stylesheet" href="css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="au_body">

    <main class="au_wrap">

        <section class="au_col">
            <header class="au_top">
                <a href="index.html" class="au_logo" aria-label="Admitly home">
                    <img src="image/logo.png"  alt="Admitly">
                </a>
            </header>

            <div class="au_card">
                <h2 class="au_title">Set a new password</h2>
                <p class="au_sub">Choose a strong password you have not used before.</p>

                <form class="au_form" action="#" method="post" data-auth-form data-loading="Saving…"
                    data-demo-next="login.html">
                    <!-- Laravel-e: @csrf ar hidden token + email input ekhane -->

                    <div class="au_field">
                        <label for="rpPass">New password</label>
                        <div class="au_pw">
                            <input type="password" id="rpPass" name="password" required minlength="8"
                                autocomplete="new-password" placeholder="Create a new password"
                                aria-describedby="rpHint">
                            <button type="button" class="au_eye" data-toggle-password="rpPass"
                                aria-label="Show password" aria-pressed="false">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                                    <circle cx="12" cy="12" r="3" />
                                    <path class="au_slash" d="m3 3 18 18" />
                                </svg>
                            </button>
                        </div>
                        <p class="au_hint" id="rpHint">At least 8 characters.</p>
                    </div>

                    <button type="submit" class="s_btn s_btn--dark au_btn">Reset password</button>
                </form>

                <p class="au_alt">
                    <a href="login.html" class="au_back">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m12 19-7-7 7-7" />
                            <path d="M19 12H5" />
                        </svg>
                        Back to login
                    </a>
                </p>
            </div>

        </section>

        <aside class="au_art" aria-hidden="true">
            <div class="au_art_txt">
                <strong>Every question bank takes you closer.</strong>
                <span>Question banks, mock tests and AI essay feedback, all in one place.</span>
            </div>
        </aside>

    </main>



    <!--jquery library js-->
    <script src="js/jquery-3.7.1.min.js"></script>
    <!--bootstrap js-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!--font-awesome js-->
    <script src="js/Font-Awesome.js"></script>


    <!--main js-->
    <script src="js/main.js"></script>
    <!--learn slider-->
    <script src="js/learn-slider.js"></script>
    <!--learn slider-->
    <script src="js/auth.js"></script>
</body>

</html>
