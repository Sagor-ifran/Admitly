<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, target-densityDpi=device-dpi" />
    <title>Admitly HTML Template</title>
    <link rel="icon" type="image/png" href="image/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


    <link rel="stylesheet" href="css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="au_body">

    <main class="au_wrap">

        <section class="au_col">
            <header class="au_top">
                <a href="index.html" class="au_logo" aria-label="Admitly home"><img src="image/logo.png"
                        alt="Admitly"></a>
            </header>

            <div class="au_card">
                <h2 class="au_title">Forgot your password?</h2>
                <p class="au_sub">Enter your email and we'll send you a link to reset it.</p>

                <form class="au_form" action="#" method="post" data-auth-form data-loading="Sending…"
                    data-demo-next="forgot-password-sent.html">
                    <div class="au_field">
                        <label for="fpEmail">Email</label>
                        <input type="email" id="fpEmail" name="email" required maxlength="254" autocomplete="email"
                            inputmode="email" placeholder="you@example.com">
                    </div>

                    <button type="submit" class="s_btn s_btn--dark au_btn">Send reset link</button>
                </form>

                <p class="au_alt">
                    <a href="login.html" class="au_back">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m12 19-7-7 7-7" />
                            <path d="M19 12H5" />
                        </svg>
                        Back to login
                    </a>
                </p>
            </div>
        </section>

        <aside class="au_art" aria-hidden="true">
            <div class="au_art_txt">
                <strong>Every question bank takes you closer.</strong>
                <span>Question banks, mock tests and AI essay feedback, all in one place.</span>
            </div>
        </aside>

    </main>



    <!--jquery library js-->
    <script src="js/jquery-3.7.1.min.js"></script>
    <!--bootstrap js-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!--font-awesome js-->
    <script src="js/Font-Awesome.js"></script>


    <!--main js-->
    <script src="js/main.js"></script>
    <!--learn slider-->
    <script src="js/learn-slider.js"></script>
    <!--learn slider-->
    <script src="js/auth.js"></script>
</body>

</html>
